apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh-bi-interface
  namespace: management
  labels:
    app.kubernetes.io/name: dsh-bi-interface
    app.kubernetes.io/component: dsh-web
    app.kubernetes.io/part-of: deepseek-harness
spec:
  replicas: 1
  # The harness holds long-lived sessions; replace rather than run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh-bi-interface
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh-bi-interface
        app.kubernetes.io/component: dsh-web
    spec:
      # hostPath data lives on exactly one node, so the pod is pinned to it.
      # Moving nodes = create the dir there first and update this hash.
      nodeSelector:
        kubernetes.io/hostname: iz0xi7yxr2llsjyhd7mvksz
      terminationGracePeriodSeconds: 30
      containers:
        - name: dsh
          image: registry.code27.co/app/dsh-bi-interface:0.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Auth model: token -> signed HttpOnly session cookie (login once).
            # `token` = no HTTP auth at all; `both` also accepts Basic for
            # `curl -u`; `basic` is the legacy challenge-everything mode.
            - name: DSH_AUTH_MODE
              value: token
            - name: DSH_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dsh-bi-interface-auth
                  key: token
            # Sliding session lifetime in seconds (30d).
            - name: DSH_SESSION_TTL
              value: "2592000"
            # Only used when DSH_AUTH_MODE is both/basic.
            - name: DSH_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: dsh-bi-interface-auth
                  key: username
            - name: DSH_AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: dsh-bi-interface-auth
                  key: password
            # dsh's browser-trust fence only accepts authorities listed here.
            - name: DSH_TRUSTED_HOST
              value: dsh-bi-interface.management.code27.co,localhost:3080,127.0.0.1:3080
            - name: DSH_HOME
              value: /opt/dsh-home
            # chrome-driverless plugin target: the service already running in
            # this cluster (no docker socket in the pod, manageContainer=false).
            - name: DSH_CHROME_BASE_URL
              value: http://chrome-driverless-mp2.management.svc.cluster.local
            - name: DSH_CONFIG_DIR
              value: /etc/dsh-credentials
            - name: WORKSPACE_DIR
              value: /root/data/project
            - name: KUBECONFIG
              value: /root/.kube/config
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            # ~/.kube and ~/.ssh imported as secrets (see deploy/apply.sh).
            - name: kubeconfig
              mountPath: /root/.kube
              readOnly: true
            - name: ssh
              mountPath: /root/.ssh
              readOnly: true
            # ~/.dsh credentials (DEEPSEEK_API_KEY, settings) imported as a secret.
            - name: dsh-credentials
              mountPath: /etc/dsh-credentials
              readOnly: true
            # Node-local persistent project dir (see deploy/apply.sh + volumes).
            - name: project
              mountPath: /root/data/project
            # dsh's own state (sessions/storages/profile cache) must survive
            # restarts, otherwise open tabs lose their session.
            - name: dsh-home
              mountPath: /opt/dsh-home
          startupProbe:
            httpGet:
              path: /__healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /__healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /__healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: kubeconfig
          secret:
            secretName: dsh-bi-interface-kubeconfig
            defaultMode: 0600
        - name: ssh
          secret:
            secretName: dsh-bi-interface-ssh
            defaultMode: 0600
        - name: dsh-credentials
          secret:
            secretName: dsh-bi-interface-dsh-credentials
            defaultMode: 0600
        # The cluster has no StorageClass, so persistence comes from the node's
        # own disk instead. /root/data/project is created by deploy/apply.sh
        # (over ssh on the bi host). type: Directory makes a missing directory a
        # loud startup failure rather than a silently empty volume, and the
        # nodeSelector in the pod spec keeps this pod on the node that owns it.
        - name: project
          hostPath:
            path: /root/data/project
            type: Directory
        # Sessions/storages/projection cache: same disk, but persistent.
        - name: dsh-home
          hostPath:
            path: /root/data/dsh-home
            type: Directory
